<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Stepy</title>
</head>

<body>
  <button class="btn btn-outline-secondary position-absolute top-0 end-0 m-3" id="langBtn">RU/EN</button>
  <div class="auth-box px-3">
    <h1 class="h3 mb-1">Stepy</h1>
    <p class="text-secondary" data-i18n="title"></p>
    <div class="card">
      <div class="card-body">
        <h2 class="h5 mb-3" data-i18n="login"></h2>
        <form id="authForm">
          <input id="email" type="email" class="form-control mb-2" required autocomplete="email" data-i18n-ph="email">
          <div id="nickWrap" class="d-none">
            <input id="nickname" class="form-control mb-2" maxlength="20" autocomplete="nickname" data-i18n-ph="nick">
          </div>
          <input id="password" type="password" class="form-control mb-2" required minlength="4" autocomplete="current-password"
            data-i18n-ph="pass">
          <div class="text-danger small mb-2" id="authError"></div>
          <div class="d-flex gap-2">
            <button id="loginBtn" class="btn btn-primary flex-fill" value="login" data-i18n="enter"></button>
            <button id="registerBtn" class="btn btn-outline-primary flex-fill" value="register" data-i18n="register"></button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/auth.js"></script>
</body>

</html>
