<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Редактор</title>
</head>

<body>
  <div id="navbar"></div>
  <main class="container" style="max-width:800px">
    <h1 class="h3 mb-3" id="pageTitle" data-i18n="newGuide"></h1>
    <form id="editorForm">
      <label class="form-label" for="fTitle" data-i18n="fGuideTitle"></label>
      <input id="fTitle" class="form-control mb-3" maxlength="100">
      <label class="form-label" for="fDesc" data-i18n="fDesc"></label>
      <textarea id="fDesc" class="form-control mb-3" rows="2" maxlength="300"></textarea>
      <label class="form-label" data-i18n="fSteps"></label>
      <div id="stepList"></div>
      <button type="button" class="btn btn-outline-secondary mb-4" id="addStep" data-i18n="addStep"></button>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" data-i18n="save"></button>
        <a class="btn btn-outline-secondary" href="catalog.html" data-i18n="cancel"></a>
      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/editor.js"></script>
</body>

</html>
