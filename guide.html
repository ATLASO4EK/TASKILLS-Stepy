<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Инструкция</title>
</head>

<body>
  <div id="navbar"></div>
  <main class="container" style="max-width:800px">
    <div class="d-flex justify-content-between align-items-start gap-2">
      <div>
        <h1 class="h3" id="gTitle"></h1>
        <p class="text-secondary" id="gDesc"></p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary d-none" id="editBtn" data-i18n="edit"></a>
        <button class="btn btn-outline-primary" id="forkBtn" data-i18n="fork"></button>
      </div>
    </div>
    <div class="progress mb-3" style="height:20px">
      <div class="progress-bar" id="bar"></div>
    </div>
    <div class="list-group mb-3" id="steps"></div>
    <div class="alert alert-success d-none" id="finished" data-i18n="done"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/guide.js"></script>
</body>

</html>
